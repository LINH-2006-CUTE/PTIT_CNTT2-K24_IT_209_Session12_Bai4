name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/linh-2006-cute/ptit_cntt2-k24-it_209_session12_bai4:latest

jobs:
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test application
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy-vps:
    name: Deploy to VPS over SSH
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Deploy container on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAME
          script_stop: true
          script: |
            set -eu

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker pull "$IMAGE_NAME"

            docker stop deploy-demo || true
            docker rm deploy-demo || true

            docker run -d \
              --name deploy-demo \
              --restart unless-stopped \
              -p 8080:8080 \
              "$IMAGE_NAME"

            docker image prune -f

            sleep 5
            curl --fail http://127.0.0.1:8080/actuator/health

            docker logout ghcr.io